name: Mod Dev Branding Site

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        name: Build Linux service and site
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.27"

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "26"

            - name: Install dependencies
              run: npm ci

            - name: Build Vite site and Debian service binary
              run: npm run build
              env:
                  GOOS: linux
                  GOARCH: amd64
                  CGO_ENABLED: 0

            - name: Stage build output
              run: |
                  set -euo pipefail
                  test -d dist
                  test -f server
                  mkdir -p artifacts/build
                  cp -r dist artifacts/build/dist
                  cp server artifacts/build/server
                  chmod +x artifacts/build/server

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-output
                  path: artifacts/build

    package:
        name: Package Debian release
        runs-on: ubuntu-latest
        needs: build

        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: build-output
                  path: build-output

            - name: Create release files
              run: |
                  set -euo pipefail
                  test -d build-output/dist
                  test -f build-output/server
                  rm -rf release dist.zip
                  mkdir release
                  (cd build-output && zip -r ../dist.zip dist)
                  cp build-output/server release/server
                  cp dist.zip release/dist.zip
                  chmod +x release/server

            - name: Upload release artifact
              uses: actions/upload-artifact@v4
              with:
                  name: release
                  path: release

    nightly:
        name: Nightly Release
        runs-on: ubuntu-latest
        needs: package
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        permissions:
            contents: write

        steps:
            - name: Download release artifact
              uses: actions/download-artifact@v4
              with:
                  name: release
                  path: artifacts/release

            - name: Get latest release tag
              id: getrelease
              env:
                  REPOSITORY: ${{ github.repository }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  latest_tag=$(curl --silent --show-error "https://api.github.com/repos/${REPOSITORY}/releases/latest" | jq -r '.tag_name // empty')
                  echo "tag=${latest_tag:-$DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"

            - name: Publish nightly release
              uses: andelf/nightly-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: nightly
                  name: "Development Release"
                  body: |
                      **Development build for commit ${{ github.sha }}**.
                      > [`View Current Changes`](${{ github.event.repository.html_url }}/compare/${{ steps.getrelease.outputs.tag }}...nightly)
                  files: |
                      artifacts/release/*
